# Create this node's identity with sfcli identity create DIR, then obtain a
# system-admin-approved invitation for this exact ID/key/listener.
# sfcd --config configs/node.join.example.yaml join \
#   --cluster CLUSTER_ID --source-public-key CONTROL_PUBLIC_KEY \
#   --invitation work/join/invitation.json
# Keep the ORIGINAL invitation/DB/identity after interruption. Then operate via
# sfcd --config configs/node.join.example.yaml run
version: 1
node:
  id: joining
  state_dir: ../work/join/state
  identity_dir: ../work/join/identity
  listen: "127.0.0.1:7444"
modules:
  network:
    enabled: false
  workload:
    enabled: false
  ingress:
    enabled: false
