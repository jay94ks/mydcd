# 주제별 설명용 발췌/대안이다. 별도 배포 입력이나 include/자동 merge 파일이 아니다.
# Group tree/정책은 partial cluster 관리, 기존 Group 순서 선택/projection은 app.yaml의 앱 소비 범위다.
# 계층·승인·병합을 설명하는 논리 예시이며 mydc/mydcd/docker compose가 직접 읽는 파일 형식은 아니다.
# 이 파일에는 비밀번호/Secret 값/실제 서명/검증자 hash를 넣지 않는다.
# Group 보호 여부/참조/승인 정책을 설명한다. 비밀번호 설정·실제 승인 요청은 별도 명시 작업이다.
schema: 1
cluster: "<CLUSTER_ID>"
tenant: tenant-demo
app: php-mysql-demo
deployment: "<STABLE_DEPLOYMENT_ID>"

vault_tree:
  # entries는 명시 순서다. 각 Secret/Group에는 parent가 하나만 존재한다.
  root:
    entries:
      - {secret: tenant-defaults}
      - {group: applications}
  groups:
    applications:
      id: group-applications
      parent: tenant
      password_required: false
      entries:
        - {group: php-mysql}
    php-mysql:
      id: group-php-mysql
      parent: applications
      password_required: true
      entries:
        - {group: common}
        - {group: db-admin}
        - {secret: web-runtime-overrides}
    common:
      id: group-php-mysql-common
      parent: php-mysql
      password_required: true
      entries:
        - {secret: db-runtime}
    db-admin:
      id: group-php-mysql-db-admin
      parent: php-mysql
      password_required: true
      allowed_services: [db]
      entries:
        - {secret: db-root}

  secrets:
    tenant-defaults:
      id: secret-tenant-defaults
      parent: tenant
      provider_profile: app-vault
      object: tenant-demo/defaults
      revision: 1
      keys: [DB_HOST, DB_PORT] # key 이름 metadata만 기록. 값은 공급자에 보관.
    db-runtime:
      id: secret-db-runtime
      parent: common
      provider_profile: app-vault
      object: php-mysql-demo/db-runtime
      revision: 1
      keys: [DB_HOST, DB_PORT, DB_USER, DB_PASSWORD]
    db-root:
      id: secret-db-root
      parent: db-admin
      provider_profile: app-vault
      object: php-mysql-demo/db-root
      revision: 1
      keys: [MYSQL_ROOT_PASSWORD]
    web-runtime-overrides:
      id: secret-web-runtime-overrides
      parent: php-mysql
      provider_profile: app-vault
      object: php-mysql-demo/web-runtime-overrides
      revision: 1
      keys: [DB_HOST]

compose_secret_application:
  web:
    sources:
      - {secret: tenant-defaults}
      - {group: common}
      - {secret: web-runtime-overrides}
    # DB_HOST: tenant-defaults → db-runtime → web-runtime-overrides 순으로 덮어씀.
    project_files:
      DB_PASSWORD: {target: /run/secrets/db-password, uid: 10001, mode: "0400"}
  db:
    sources:
      - {secret: tenant-defaults}
      - {group: common}
      - {group: db-admin}
    project_files:
      DB_PASSWORD: {target: /run/secrets/db-password, uid: 10001, mode: "0400"}
      MYSQL_ROOT_PASSWORD: {target: /run/secrets/db-root-password, uid: 10001, mode: "0400"}

approval_policy:
  prompt: once-per-required-group-without-valid-approval
  # 두 서비스/두 노드가 공유하는 부모/공통 Group을 중복해서 묻지 않는다.
  expected_initial_password_groups: [php-mysql, common, db-admin]
  reuse: same-deployment-and-valid-group-scope
  consumer_services: [web, db]
  permitted_nodes: [node-a, node-b]
  signed_payload_fields: [approved_at, fact, target]
  fact: secret-group-use-approved
  password_storage: none
  # 실 승인 target은 Group별 서비스 범위와 parent policy/issuer/current revoke까지 검증.
  # 특히 db-admin의 승인을 web으로 확대하지 않는다.
