name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anchore/sbom-action/download-syft@v0
      - name: Build archive, notices, SBOM and checksums
        run: make dist GOARCH=${{ matrix.goarch }} VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/THIRD_PARTY_NOTICES

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sfc-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/jay94ks/sfc-web:${{ github.ref_name }}

  # The sfc-web cluster app image bundle per platform, signed with the
  # release key. SFC_RELEASE_KEY is a repository Actions secret (hex Ed25519
  # seed from tools/clusterapp-bundle keygen); only the signing step sees it.
  web-bundle:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and sign the bundle
        env:
          SFC_RELEASE_KEY: ${{ secrets.SFC_RELEASE_KEY }}
        run: make webbundle GOARCH=${{ matrix.goarch }} VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-${{ matrix.goarch }}
          path: dist/sfc-web-image_*.tar.gz

  publish:
    needs: [binaries, image, web-bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.spdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/THIRD_PARTY_NOTICES
            dist/SHA256SUMS
