name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The sfc-web cluster app image bundle per platform, signed with the
  # release key. SFC_RELEASE_KEY is a repository Actions secret (hex Ed25519
  # seed from tools/clusterapp-bundle keygen); only the signing steps see it.
  web-bundle:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and sign the bundle
        env:
          SFC_RELEASE_KEY: ${{ secrets.SFC_RELEASE_KEY }}
        run: make webbundle GOARCH=${{ matrix.goarch }} VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-${{ matrix.goarch }}
          path: dist/sfc-web-image_*.tar.gz

  # deb, rpm and tar.gz per architecture (packaging/, make packages). Each
  # architecture builds natively on its own runner: runc needs cgo.
  packages:
    needs: [web-bundle]
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle-${{ matrix.goarch }}
          path: dist
      - name: Build packages, notices and SBOM
        run: make packages sbom GOARCH=${{ matrix.goarch }} VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.goarch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/sfc_*.tar.gz
            dist/*.spdx.json
            dist/THIRD_PARTY_NOTICES

  publish:
    needs: [packages, web-bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm *.tar.gz *.spdx.json > SHA256SUMS
      # SHA256SUMS.sig: the release key's hex Ed25519 signature of SHA256SUMS,
      # checked against the key built into sfcd before anything is published.
      - name: Sign the checksums
        env:
          SFC_RELEASE_KEY: ${{ secrets.SFC_RELEASE_KEY }}
        run: |
          go run ./tools/clusterapp-bundle sign-file -key-env SFC_RELEASE_KEY -file dist/SHA256SUMS
          go run ./tools/clusterapp-bundle verify-file -builtin -file dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.spdx.json
            dist/THIRD_PARTY_NOTICES
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
