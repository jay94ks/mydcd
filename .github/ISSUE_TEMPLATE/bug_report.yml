name: Bug report
description: Something does not work as documented
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form — follow SECURITY.md instead.
        한국어로 작성해도 됩니다.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and its full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Minimal steps, and a trimmed app.yaml or node.yaml if relevant (remove secrets).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Seafield Cluster version
      description: Output of `sfcli --version` and `sfcd --version`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and kernel, Docker Engine version, number of servers, architecture.
      placeholder: |
        - OS: Ubuntu 24.04, kernel 6.8
        - Docker Engine: 28.1
        - Servers: 3 (amd64)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: sfcd logs around the failure. This is rendered as code.
      render: shell
